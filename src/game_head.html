<meta charset="utf-8">
<!-- Without this a phone lays the page out at 980px and scales the result down
     to fit, so everything on screen arrives at roughly 40% of its drawn size.
     viewport-fit=cover then lets the room run under the notch, and the bars
     below pad themselves back out with env(safe-area-inset-*). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b7f93">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Seat Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">

<style>
/* One committed visual world - a sunny depot at midday - so there is no dark
   variant. Every colour is stated outright rather than inherited from the host. */
:root {
  color-scheme: light;
  --sky-hi: #9cc3d4; --sky-lo: #5b7f93;
  --livery: #f8bf1a; --livery-dk: #d99c14;
  --trim: #d8452c; --trim-dk: #a83220;
  --ink: #22283c; --ink-soft: #4b5570;
  --panel: #fffaf0; --panel-dk: #ede2cd;
  --chip: #2b3452; --chip-lip: #1a2138;
  --gold: #ffd75e; --gold-dk: #e0a71d;
  --hud: #4a7ad0; --hud-dk: #33599a;
  --go: #3fb95a; --go-dk: #2c8b41;
  --no: #d8556a; --no-dk: #a63c4e;
  --disp: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  /* The home screen and the results card are ports of Marble Sort's, down to the
     coordinates, so they carry that game's own face and palette rather than
     being re-tinted into this one. Everything else stays Seat Match's. */
  --ms: "Lilita One", "Baloo 2", Arial, sans-serif;
  --ms-ink: #2b3550; --ms-face: #e9e8f7; --ms-edge: #c6c2e2;
  --ms-win: #4bc84b; --ms-lose: #d8556a; --ms-gold: #ffc21e; --ms-rays: #ffd75e;
  /* Sampled off the cover's own top and bottom rows, not chosen. A frame whose
     aspect is taller than the design box's leaves a band above and below the
     art, and a flat fill there matches the render at one end and steps away
     from it at the other - a line across the screen at the height the eye is
     already looking. */
  --cover-top: #161a36; --cover-foot: #4a548e;
  --body: Nunito, "Segoe UI", system-ui, sans-serif;
  /* the notch, the home indicator and the rounded corners */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ink); color: var(--ink);
  font-family: var(--body); overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  /* a phone inflates text it decides is an article column, and without
     manipulation every tap waits out a possible double-tap zoom first */
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation;
}
#app {
  width: 100%; min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; position: relative; overflow: hidden;
  background: linear-gradient(180deg, var(--sky-hi), var(--sky-lo));
}
/* the bars run edge to edge; their contents stay a readable width */
.topbar { width: 100%; max-width: 46rem; margin-inline: auto; }
.screen { display: none; flex: 1; flex-direction: column; }
.screen.on { display: flex; }

/* ---------- home ----------
   A port of Marble Sort's HomeScene, which is a picture with two buttons on it.
   That game lays out in a 540 x 1160 design box and lets Phaser FIT it to the
   frame; the same thing here is a `.design` block of exactly those pixels,
   scaled by `--k`, so every number below is the number in its source and there
   is nothing to convert. `--dw` is the box's width, which Home - and only Home -
   widens on a landscape frame, because it is the one screen with no board on it. */
#home { position: relative; overflow: hidden;
  background: linear-gradient(180deg, var(--cover-top), var(--cover-foot)); }
#home .design {
  position: absolute; left: 50%; top: 50%;
  width: calc(var(--dw) * 1px); height: 1160px;
  transform: translate(-50%, -50%) scale(var(--k)); transform-origin: 50% 50%;
  font-family: var(--ms);
}
/* Everything inside is placed in design units, from the top left of the box. */
#home .design > * { position: absolute; }

/* The cover, fitted to the box the way HomeScene fits it: filling a portrait
   frame, and fitted to the height and moved left on a wide one. */
.cover {
  left: calc(var(--art-l) * 1px); top: calc(var(--art-t) * 1px);
  width: calc(var(--art-w) * 1px); height: calc(var(--art-h) * 1px);
  animation: breathe 5.2s ease-in-out infinite alternate;
}
/* A completely still home screen reads as a screenshot rather than as a game
   waiting for you, so the cover breathes - the same idle the title used to have. */
@keyframes breathe { to { transform: scale(1.03); } }
/* Wide, the art is fitted to the height and there is bare box either side. The
   gap is filled by stretching the render's own edge column, not by a colour
   picked to look close: the cover's edges are a vertical ramp rather than one
   navy, so any flat fill draws a soft rectangle around the art at exactly the
   height the eye is already looking. `background-size` does the stretching -
   1080 / 6 = 180, so sizing the image at 180 gap-widths puts its leftmost six
   pixels across the whole gap. */
.edge {
  top: 0; height: 100%; background-image: var(--cover-url); background-repeat: no-repeat;
}
.edge-l {
  left: 0; width: calc(var(--art-l) * 1px);
  background-size: calc(var(--art-l) * 180px) 100%; background-position: left top;
}
.edge-r {
  left: calc((var(--art-l) + var(--art-w)) * 1px); width: calc(var(--edge-r) * 1px);
  background-size: calc(var(--edge-r) * 180px) 100%; background-position: right top;
}
.edge[hidden] { display: none; }
/* A scrim, not a panel: it darkens the lower third *through* the art so the UI
   has a ground under it. Portrait only - wide, the button has its own column
   beside the picture and this would just be dimming it. */
.scrim {
  left: 0; top: 696px; width: 100%; height: 464px;
  background: linear-gradient(180deg, rgba(26,27,72,0), rgba(26,27,72,.82) 40%);
}
.scrim[hidden] { display: none; }

/* ⚠ There is no `.logo` rule any more, and that is deliberate. The cover render
   carries the name itself now - home_cover.py bakes it in the same livery, with
   the same drop stack this rule used to describe - which is what lets the store
   covers be crops of that render: a title living in the DOM cannot come with
   them. Setting it here as well printed it twice. */

/* ---- the chrome: two gold discs, one call to action, one wallet row ---- */
.round {
  width: 76px; height: 76px; padding: 0; border: 0; background: none; cursor: pointer;
  display: grid; place-items: center;
}
.round i {
  position: absolute; width: 52px; height: 52px; border-radius: 16px;
  background: linear-gradient(180deg, #ffd964, #f5a91a);
  box-shadow: 0 6px 0 #c67a06;
}
.round i::before {
  content: ""; position: absolute; left: 5px; right: 5px; top: 4px; height: 16px;
  border-radius: 9px; background: rgba(255,255,255,.4);
}
.round span { position: relative; font-size: 26px; line-height: 1; }
.round:active i { transform: translateY(3px); box-shadow: 0 3px 0 #c67a06; }
#h-hearts { left: calc(var(--corner-l) * 1px); top: 70px; transform: translate(-50%, -50%); }
#h-levels { left: calc(var(--corner-r) * 1px); top: 70px; transform: translate(-50%, -50%); }
/* "there is something here" - a badge that is always on is furniture within a
   day, so it only lights when the count is actually below full. */
.round b {
  position: absolute; right: 8px; top: 6px; min-width: 26px; height: 26px; padding: 0 6px;
  border-radius: 999px; background: #e33b3b; border: 3px solid #fff; color: #fff;
  font-size: 17px; line-height: 20px; font-family: var(--ms);
}
.round.full b { background: #3fb43f; }
.round em {
  position: absolute; left: 50%; top: 76px; transform: translateX(-50%);
  font-style: normal; font-size: 19px; color: #fff; opacity: .8; white-space: nowrap;
  text-shadow: 0 2px 3px rgba(0,0,0,.6);
}

/* The two button faces are Marble Sort's `face()` painter written as CSS: an
   edge slab 6px below the face, a vertical ramp on the face, and a white gloss
   over its top third. */
.wide-btn {
  width: 260px; height: 76px; border: 0; border-radius: 24px; cursor: pointer; padding: 0;
  font-family: var(--ms); font-size: 27px; color: #fff;
  background: linear-gradient(180deg, #7fe06a, #3fb43f);
  box-shadow: 0 6px 0 #2c8330;
  -webkit-text-stroke: 6px var(--ms-ink); paint-order: stroke fill;
}
.wide-btn.blue { background: linear-gradient(180deg, #8fb6ff, #4a7de0); box-shadow: 0 6px 0 #2c53a3; }
.wide-btn::before {
  content: ""; position: absolute; left: 6px; right: 6px; top: 5px; height: 23px;
  border-radius: 14px; background: rgba(255,255,255,.4); pointer-events: none;
}
.wide-btn:active { transform: translate(-50%, 3px) scale(var(--play-s)); box-shadow: 0 3px 0 #2c8330; }

#h-play {
  left: calc(var(--ui-cx) * 1px); top: calc(var(--play-y) * 1px);
  transform: translate(-50%, -50%) scale(var(--play-s));
}
#h-play:active { transform: translate(-50%, calc(-50% + 3px)) scale(var(--play-s)); }

.wallet {
  left: calc(var(--ui-cx) * 1px); top: calc(var(--wallet-y) * 1px);
  transform: translate(-50%, -50%) scale(var(--wallet-s));
  display: flex; align-items: center; gap: 10px;
  font-family: var(--ms); font-size: 30px; color: #fff;
  -webkit-text-stroke: 6px var(--ms-ink); paint-order: stroke fill;
}
.wallet .gap { width: 34px; }
.wallet .starw { display: block; width: 42px; height: 42px; }
.wallet .starw svg { display: block; width: 100%; height: 100%; }
.wallet .coin {
  width: 40px; height: 40px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #ffe89a, var(--ms-gold) 55%, #c67a06);
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.18);
}
.ver {
  left: calc(var(--ui-cx) * 1px); top: 1120px; transform: translateX(-50%);
  font-size: 16px; color: #fff; opacity: .55; white-space: nowrap;
}

/* ---------- top bar ---------- */
#play { position: relative; }
#play .topbar { position: relative; z-index: 2; }
.topbar {
  display: grid; grid-template-columns: auto 1fr auto; gap: .6rem; align-items: center;
  padding: calc(.7rem + var(--safe-t)) calc(.8rem + var(--safe-r)) .55rem calc(.8rem + var(--safe-l));
}
.icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: 13px; cursor: pointer;
  background: rgba(12,20,34,.4); color: #fff; font-size: 1.15rem; line-height: 1;
  display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.25);
}
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.icon-btn .gear { width: 60%; height: 60%; display: block; }
.icon-btn .gear path, .icon-btn .gear circle {
  fill: none; stroke: #fff; stroke-width: 1.9; stroke-linejoin: round; }
.meter { display: flex; flex-direction: column; gap: .28rem; }
.meter-top { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem;
  font-family: var(--disp); font-weight: 800; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
.meter-top .lvl { font-size: 1.05rem; letter-spacing: .05em; }

/* ---------- the play HUD ----------
   Three pills across the top, boosters along the bottom, and the same at every
   width. The readings used to move out to rails beside the room once the window
   got wide, so the game read as two different games depending on the screen. */
.hud-side { display: flex; align-items: center; gap: .5rem; }
.hud-side.end { justify-content: flex-end; }
.pill {
  display: flex; align-items: center; gap: .4rem;
  background: var(--hud); color: #fff; border-radius: 999px;
  padding: .32rem .9rem; font-family: var(--disp); font-weight: 800;
  box-shadow: 0 3px 0 var(--hud-dk), 0 5px 12px rgba(0,0,0,.22);
}
.pill-lab { font-size: .76rem; letter-spacing: .09em; text-transform: uppercase; opacity: .92; }
.pill-val { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.pill-val.warn { color: var(--gold); }
/* the clock is the one reading the player actually watches, so it is the only
   pill given two lines and the big type */
.pill-time { flex-direction: column; gap: 0; justify-self: center; padding: .22rem 1.15rem .3rem; }
.pill-time .pill-lab { font-size: .7rem; }
.pill-time .pill-val { font-size: 1.5rem; line-height: 1.05; }
.pill-gold .disc {
  width: 20px; height: 20px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #ffe89a, var(--gold) 55%, var(--gold-dk));
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.12);
}
/* The strip under the pills held a progress bar, and it is gone: the clock says
   how much time is left and the bar said how much of it had gone - the same fact
   twice, one of them a green rule ruled across the top of the room. The clock
   still turns gold under 25%, which is the part of it that was doing any work. */

/* ---------- stage ---------- */
#play { background: #98a1ab; }
.stage { position: absolute; inset: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%;
  display: block; touch-action: none; }

/* ---------- boosters ----------
   A row of tiles under the room, each one a colour of its own with the cost on a
   chip across its foot. They used to be dark slabs with the price inside them,
   which read as three copies of the same disabled button. The chip hangs over
   the bottom edge on purpose: it is what makes the tile look like a thing you
   spend on rather than a label. */
.boosters {
  position: absolute; left: 50%; bottom: calc(1.1rem + var(--safe-b));
  transform: translateX(-50%); z-index: 3; display: flex; gap: .8rem;
}
.boost {
  position: relative; width: 4.1rem; height: 4.1rem; padding: 0; border: 0;
  border-radius: 20px; cursor: pointer; color: #fff;
  display: grid; place-items: center;
  background: linear-gradient(180deg, var(--b-hi), var(--b-lo));
  box-shadow: 0 4px 0 var(--b-dk), 0 6px 14px rgba(0,0,0,.3);
  transition: transform .08s, filter .15s;
}
#b-time { --b-hi: #ffa63d; --b-lo: #f4801c; --b-dk: #c25f0d; }
#b-jump { --b-hi: #b06ff0; --b-lo: #8f4ade; --b-dk: #6b32ad; }
#b-area { --b-hi: #55d98f; --b-lo: #2bb56e; --b-dk: #16794a; }
.boost:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--b-dk); }
.boost .ico { width: 54%; height: 54%; margin-bottom: .35rem; display: block; }
.boost .ico path, .boost .ico circle, .boost .ico rect {
  fill: none; stroke: #fff; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round;
}
/* the cost chip, sitting across the bottom edge of the tile */
.boost .cost {
  position: absolute; left: 50%; bottom: -.42rem; transform: translateX(-50%);
  display: flex; align-items: center; gap: .22rem; white-space: nowrap;
  background: linear-gradient(180deg, #5fd472, #3aa94f);
  box-shadow: 0 2px 0 #2b8039; border-radius: 999px; padding: .1rem .5rem;
  font: 800 .78rem/1.35 var(--disp); color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.25);
}
.boost .cost::after {
  content: ""; width: 11px; height: 11px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #ffe89a, var(--gold) 55%, var(--gold-dk));
}
/* goes in hand, not a price: no coin. The chip stays green and the number
   stands on its own - see costChip() in the shell. */
.boost .cost.own::after { display: none; }
.boost .cost.own { padding-inline: .62rem; }
.boost.armed { outline: 3px solid var(--gold); outline-offset: 3px; }
/* too poor to press it: the tile stays lit, only the price turns */
.boost.broke .cost { background: linear-gradient(180deg, #e8798a, #cf4a60); box-shadow: 0 2px 0 #a3374a; }
/* spent on this board: there is no price left to quote, so the chip goes rather
   than standing there saying so. The tile dims to carry the same thing without
   a word. */
.boost.spent { filter: grayscale(.75) brightness(.7); }
.boost.spent .cost { display: none; }
/* not unlocked yet. It stays on the row, greyed, with the level it arrives at:
   hiding it made the row change shape without ever saying why. */
.boost.locked { --b-hi: #7c8798; --b-lo: #5d687a; --b-dk: #414b5a; filter: saturate(.35); }
.boost.locked .ico { opacity: .55; }
.boost.locked .cost {
  background: linear-gradient(180deg, #6a7686, #4c5666); box-shadow: 0 2px 0 #39424f;
  font-size: .7rem; letter-spacing: .04em;
}
.boost.locked .cost::after { display: none; }

/* ---------- tutorial coach mark ----------
   The pointing is done on the canvas, in the room's own projection; this is
   only the words that go with it. It sits where the boosters will later live -
   they unlock at level 14, long after the last coached board. */
.coach {
  position: absolute; left: 50%; bottom: 1.2rem; transform: translateX(-50%);
  z-index: 4; width: min(23rem, calc(100% - 1.8rem));
  display: flex; flex-direction: column; gap: .18rem; text-align: center;
  background: rgba(14,20,30,.82); border: 2px solid rgba(255,215,94,.6);
  border-radius: 18px; padding: .65rem 1.1rem; color: #fff;
  box-shadow: 0 6px 20px rgba(0,0,0,.4); pointer-events: none;
  animation: coach-in .3s cubic-bezier(.34,1.4,.64,1) both;
}
.coach[hidden] { display: none; }      /* an author `display` outranks the UA rule */
.coach b { font-family: var(--disp); font-weight: 800; font-size: 1rem;
           letter-spacing: .03em; color: var(--gold); }
.coach span { font-weight: 700; font-size: .84rem; line-height: 1.45; color: #eaf3f7; }
@keyframes coach-in {
  from { opacity: 0; transform: translate(-50%, 14px) scale(.95); }
  to   { opacity: 1; transform: translate(-50%, 0) scale(1); }
}
@media (prefers-reduced-motion: reduce) { .coach { animation: none; } }

/* a message has to live somewhere now the hint bar is gone */
.toast {
  position: absolute; left: 50%; bottom: calc(5.9rem + var(--safe-b)); transform: translateX(-50%);
  margin: 0; z-index: 3; max-width: 24rem; text-align: center;
  background: rgba(14,20,30,.72); color: #fff; font-weight: 700; font-size: .88rem;
  padding: .55rem 1rem; border-radius: 999px; pointer-events: none;
  opacity: 0; transition: opacity .2s;
}
.toast.on { opacity: 1; }


/* ---------- level grid ---------- */
#levels { overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 1rem calc(1rem + var(--safe-r)) calc(1rem + var(--safe-b)) calc(1rem + var(--safe-l)); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: .5rem; }
.cellbtn {
  aspect-ratio: 1; border: 0; border-radius: 14px; cursor: pointer; font-family: var(--disp);
  font-weight: 800; font-size: 1rem; color: #fff; position: relative;
  background: linear-gradient(180deg, #6d84a8, #4c5f7d); box-shadow: 0 3px 0 rgba(0,0,0,.28);
}
.cellbtn.done { background: linear-gradient(180deg, var(--go), var(--go-dk)); }
/* ---------- the hard levels ----------
   `difficultLevel` off the APK board: 0, 1 or 2. 118 of the 600 campaign levels
   carry one, and the game shows it in two places - the tile here, and the level
   pill while the board is up.

   ⚠ These sit between `.done` and `.locked` on purpose. A hard level that has
   been cleared keeps its warning colour, because the tile is also how a player
   decides what to replay, and the stars along the bottom already say it was
   beaten. Locked still wins over both: a board that cannot be opened should not
   be shouting. */
.cellbtn.hard  { background: linear-gradient(180deg, #ef7d4d, #c1502a); }
.cellbtn.shard { background: linear-gradient(180deg, #a95ce2, #7233ab); }
.cellbtn.locked { background: rgba(20,28,44,.4); color: rgba(255,255,255,.4); cursor: not-allowed; }
.cellbtn .s { position: absolute; inset: auto 0 3px 0; font-size: .55rem; letter-spacing: .1em; color: var(--gold); }
.cellbtn .d {
  position: absolute; inset: 4px 0 auto 0; font-size: .44rem; font-weight: 800;
  letter-spacing: .07em; color: rgba(255,255,255,.95); text-shadow: 0 1px 0 rgba(0,0,0,.25);
}
.cellbtn.locked .d { color: rgba(255,255,255,.42); text-shadow: none; }
/* The grade rides beside the level pill as its own control, so "Level 9" keeps
   reading as "Level 9". Tapping it brings the warning card back - a chip that
   cannot be pressed is a label wearing a button's clothes. */
.grade {
  border: 0; cursor: pointer; font-family: var(--disp); font-weight: 800;
  font-size: .6rem; letter-spacing: .04em; text-transform: uppercase; color: #fff;
  border-radius: 999px; padding: .26rem .46rem; white-space: nowrap; line-height: 1.15;
  background: var(--gr); box-shadow: 0 3px 0 var(--gr-dk), 0 5px 12px rgba(0,0,0,.22);
}
.grade:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gr-dk); }
.grade.hard  { --gr: #e0673a; --gr-dk: #ac4522; }
.grade.shard { --gr: #9a4bd6; --gr-dk: #6b2c9e; }
/* ⚠ Spelled out. `.grade` sets no display of its own today, so the UA rule for
   [hidden] would carry it - but the export panel and the coach card were both
   caught by exactly that assumption the moment they were given a display, and
   the chip sits in a flex row that invites one. */
.grade[hidden] { display: none; }

/* ---------- the hard-level warning ----------
   A stamp over the board that plays and goes. Not a card with a button: there is
   nothing here to decide, and a panel that has to be dismissed turns a heads-up
   into a toll on the way into every retry.

   ⚠ pointer-events: none. It is over the board for a beat and the board is what
   the player came for - it must never swallow the first drag. */
#warn {
  position: absolute; inset: 0; display: none; z-index: 25;
  place-items: center; pointer-events: none; font-family: var(--ms);
}
#warn.on { display: grid; }
#warn.hard  { --st: #ac4522; }
#warn.shard { --st: #6b2c9e; }
#warn .stamp {
  /* Wrapped by width, not by a newline in the string: a two-line label written
     with an escape is one heredoc away from a literal newline inside a JS
     string, which is a parse error that takes the whole page with it. */
  font-size: 46px; line-height: 1.05; text-align: center; color: #fff; max-width: 6.2em;
  letter-spacing: .02em; -webkit-text-stroke: 9px var(--st); paint-order: stroke fill;
  animation: stamp 1.5s ease-out both;
}
@keyframes stamp {
  0%   { transform: scale(1.55); opacity: 0; }
  16%  { transform: scale(1);    opacity: 1; }
  68%  { transform: scale(1);    opacity: 1; }
  100% { transform: scale(1.08); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  #warn .stamp { animation: stamp-fade 1.5s linear both; }
  @keyframes stamp-fade { 0%,80% { opacity: 1; } 100% { opacity: 0; } }
}

/* ---------- result card ----------
   Marble Sort's `GameScene.overlay`, port for port. Same 540 x 1160 design box
   as the home screen, so every coordinate here is the coordinate in its source:
   the panel at x 66 w 408, the header 84 tall, the stars on y 500, the bar on
   564, and everything below the stars pushed down by `--dy` (66) when the
   feature bar is on the card. */
#card { position: absolute; inset: 0; display: none; z-index: 20; font-family: var(--ms); }
#card.on { display: block; }
#card .design {
  --dy: 0px; --dz: 0px;              /* the room the bar and the streak line need */
  --dr: 0px;                         /* ...and the room the revive button needs */
  position: absolute; left: 50%; top: 50%; width: 540px; height: 1160px;
  transform: translate(-50%, -50%) scale(var(--k)); transform-origin: 50% 50%;
}
#card .design > * { position: absolute; }
.dim { position: absolute; inset: 0; background: rgba(13,10,42,.78); }

/* A slow sunburst, and it is the one element that keeps moving - which is what
   stops a static results card feeling like an error dialog. Sixteen wedges with
   the light falling off outwards: flat wedges have a hard outer edge and read as
   cut paper. `screen` is the CSS of the additive blend it is drawn with. */
.rays {
  left: 50%; top: 50%; width: 988px; height: 988px; border-radius: 50%;
  transform: translate(-50%, -50%) scale(var(--k)) translateY(-80px);
  mix-blend-mode: screen; pointer-events: none;
  background: repeating-conic-gradient(var(--ms-rays) 0deg 14.1deg, transparent 14.1deg 22.5deg);
  -webkit-mask-image: radial-gradient(circle closest-side, #000 5%, rgba(0,0,0,.55) 45%, transparent 100%);
  mask-image: radial-gradient(circle closest-side, #000 5%, rgba(0,0,0,.55) 45%, transparent 100%);
  animation: spin 26s linear infinite, rayfade 3.2s ease-in-out infinite alternate;
}
@keyframes spin { to { transform: translate(-50%, -50%) scale(var(--k)) translateY(-80px) rotate(360deg); } }
@keyframes rayfade { from { opacity: .6; } to { opacity: .32; } }
.rays[hidden] { display: none; }

/* Three stacked plates: a soft drop, the machine's edge, and its face.

   ⚠ The extra 46 is the one number on this card that is not Marble Sort's. Its
   panel is `392 + dy` tall and its HOME button is centred 4px below the foot of
   that, so the button hangs two thirds of its height off the card it belongs to.
   Reproduced faithfully it reads as a layout that failed rather than as a style,
   so the panel is grown to hold both buttons and every other coordinate is left
   exactly where it was found. `--dz` is the same idea as `--dy`, for the streak
   line this game has and that one does not: one number, so the card without a
   streak stays exactly the card it already was. */
.panel {
  left: 58px; top: 368px; width: 424px; height: calc(408px + var(--dy) + var(--dz) + var(--dr) + 46px);
  border-radius: 36px; background: rgba(29,26,69,.55);
}
.panel i {
  position: absolute; left: 2px; top: -6px; width: 420px; height: calc(400px + var(--dy) + var(--dz) + var(--dr) + 46px);
  border-radius: 34px; background: var(--ms-edge);
}
.panel u {
  position: absolute; left: 8px; top: -12px; width: 408px; height: calc(392px + var(--dy) + var(--dz) + var(--dr) + 46px);
  border-radius: 32px; background: var(--ms-face); overflow: hidden;
}
/* The header band: rounded at the top, square where it meets the face. */
.panel u b {
  position: absolute; inset: 0 0 auto 0; height: 84px; border-radius: 32px 32px 0 0;
  background: var(--ms-win);
}
#c-card.lose .panel u b { background: var(--ms-lose); }
.head {
  left: 0; top: 398px; width: 540px; text-align: center; transform: translateY(-50%);
  font-size: 40px; color: #fff; -webkit-text-stroke: 8px var(--ms-ink); paint-order: stroke fill;
}

/* ---- stars ----
   The middle one is the big one, they land one after another, and each landing
   punches a flash and a scatter of twinkles. */
.stars { left: 0; top: 0; width: 540px; height: 0; }
.star {
  position: absolute; top: 500px; transform: translate(-50%, -50%) scale(.1);
  width: 55px; height: 55px; margin-top: 0;
}
.star.big { width: 70px; height: 70px; top: 486px; }
.star.pop { animation: starpop .3s cubic-bezier(.34,1.56,.64,1) forwards; }
@keyframes starpop { to { transform: translate(-50%, -50%) scale(1); } }
.flash, .spark {
  position: absolute; border-radius: 50%; pointer-events: none;
  transform: translate(-50%, -50%); mix-blend-mode: screen;
}
.flash {
  width: 160px; height: 160px;
  background: radial-gradient(circle, rgba(255,224,122,.95), rgba(255,224,122,.35) 45%, transparent 70%);
  animation: flashout .42s ease-out forwards;
}
@keyframes flashout {
  from { transform: translate(-50%, -50%) scale(.25); opacity: .75; }
  to   { transform: translate(-50%, -50%) scale(1);   opacity: 0; }
}
.spark { width: 26px; height: 26px; background: #ffe07a; animation: sparkout .5s ease-out forwards; }
@keyframes sparkout {
  from { transform: translate(-50%, -50%) scale(.45); opacity: 1; }
  to   { transform: translate(calc(-50% + var(--sx)), calc(-50% + var(--sy))) scale(.02); opacity: 0; }
}

/* ---- "you are this far from something new" ----
   The bar animates from where the player was, not from zero and not straight to
   the answer: a bar drawn at 63% is a fact, a bar that visibly moves from 56% to
   63% is the reward for the level they just played. */
.feat { left: 0; top: 564px; width: 540px; height: 0; }
.feat[hidden] { display: none; }
.feat .track {
  position: absolute; left: 92px; top: -13px; width: 300px; height: 26px;
  border-radius: 13px; background: #2f3550;
}
.feat .fill {
  position: absolute; left: 95px; top: -10px; height: 20px; border-radius: 10px;
  background: #5ecfe0; width: 0; min-width: 20px; transition: width .9s cubic-bezier(.33,1,.68,1);
}
.feat .fill.empty { min-width: 0; }
/* The prize on the end of the bar. A frame rather than a bare sprite: these are
   board pieces, and one floating on a results card reads as a stray until
   something holds it. */
.feat .badge {
  position: absolute; left: 390px; top: -34px; width: 68px; height: 68px;
  border-radius: 16px; background: #b4801a; display: grid; place-items: center;
}
.feat .badge::before {
  content: ""; position: absolute; left: 4px; top: 4px; width: 60px; height: 60px;
  border-radius: 13px; background: var(--ms-gold);
}
.feat .badge::after {
  content: ""; position: absolute; left: 9px; top: 9px; width: 50px; height: 50px;
  border-radius: 10px; background: #b6b1d8;
}
.feat .badge > * {
  position: relative; z-index: 1; max-width: 44px; max-height: 44px;
  width: auto; height: auto; display: block;
}
.feat .badge svg { width: 40px; height: 40px; }
.feat .badge svg path, .feat .badge svg circle {
  fill: none; stroke: var(--ms-ink); stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round;
}
.feat .badge.hit { animation: badgehit .26s ease-in-out 3 alternate; }
@keyframes badgehit { to { transform: scale(1.12); } }
.feat .lab {
  position: absolute; left: 0; top: 20px; width: 540px; text-align: center;
  font-size: 20px; color: #b58a2b;
}

/* ---- the purse, the buttons, the paper ---- */
.coins {
  left: 232px; top: calc(602px + var(--dy)); transform: translateY(-50%);
  display: flex; align-items: center; gap: 8px;
  font-size: 30px; color: #ffd964; -webkit-text-stroke: 6px var(--ms-ink); paint-order: stroke fill;
}
.coins .coin {
  width: 44px; height: 44px; border-radius: 50%; -webkit-text-stroke: 0;
  background: radial-gradient(circle at 34% 30%, #ffe89a, var(--ms-gold) 55%, #c67a06);
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.18);
}
.coins[hidden] { display: none; }
.streak {
  left: 0; top: calc(636px + var(--dy)); width: 540px; text-align: center;
  font-size: 19px; color: #b58a2b;
}
.streak[hidden] { display: none; }
.sum { left: 66px; top: 500px; width: 408px; text-align: center; margin: 0;
  font-size: 23px; line-height: 1.4; color: #3b465f; }
.sum b { color: var(--ms-ink); }
.sum span { display: block; margin-top: 26px; font-size: 19px; color: #7c88a6; }
/* Revive sits where the eye already is - the first button under the text - and
   the other two move down by exactly the gap they already had between them. */
#c-revive { left: 270px; top: calc(670px + var(--dy) + var(--dz)); transform: translate(-50%, -50%); }
#c-next { left: 270px; top: calc(670px + var(--dy) + var(--dz) + var(--dr)); transform: translate(-50%, -50%); }
#c-home { left: 270px; top: calc(752px + var(--dy) + var(--dz) + var(--dr)); transform: translate(-50%, -50%); }
#c-revive:active, #c-next:active, #c-home:active { transform: translate(-50%, calc(-50% + 3px)); }
#c-revive[hidden] { display: none; }
/* Gold, because it is the one button on the card that costs something. The
   price rides on its corner the way the boosters' does, rather than inside the
   label, where "REVIVE +1:00 500" reads as one number too many. */
.wide-btn.gold { background: linear-gradient(180deg, #ffd76a, #efa326); box-shadow: 0 6px 0 #b9750f; }
.wide-btn.gold:active { box-shadow: 0 3px 0 #b9750f; }
/* Three things on one line, so the label is laid out rather than centred as a
   run of text. The price chip is absolute and stays out of it. */
#c-revive { display: flex; align-items: center; justify-content: center; gap: 8px; }
#c-revive b { color: #fff3c4; }
#c-revive .clk { width: 34px; height: 34px; flex: none; margin-top: -2px; }
#c-revive .clk g { fill: none; stroke-linecap: round; stroke-linejoin: round; }
#c-revive .clk .ink { stroke: var(--ms-ink); stroke-width: 6.4; }
#c-revive .clk .lit { stroke: #fff; stroke-width: 2.6; }
#c-revive .cost {
  position: absolute; right: -10px; top: -14px;
  display: flex; align-items: center; gap: 5px; white-space: nowrap;
  background: linear-gradient(180deg, #5fd472, #3aa94f);
  box-shadow: 0 3px 0 #2b8039; border-radius: 999px; padding: 3px 12px;
  font-size: 21px; color: #fff; -webkit-text-stroke: 4px var(--ms-ink); paint-order: stroke fill;
}
#c-revive .cost::after {
  content: ""; width: 17px; height: 17px; border-radius: 50%; -webkit-text-stroke: 0;
  background: radial-gradient(circle at 34% 30%, #ffe89a, var(--ms-gold) 55%, #c67a06);
}
/* Not enough gold. The button stays where it is and stays readable - hiding it
   would answer "why is this level unwinnable" with nothing - and only the price
   turns, which is the part that is actually the problem. */
#c-revive.broke { background: linear-gradient(180deg, #b9b3cd, #8d87a5); box-shadow: 0 6px 0 #6b6681; }
#c-revive.broke:active { box-shadow: 0 3px 0 #6b6681; }
#c-revive.broke .cost { background: linear-gradient(180deg, #e8798a, #cf4a60); box-shadow: 0 3px 0 #a3374a; }
/* The toast that would normally say why lives under the card, so the refusal
   has to happen on the button itself. */
#c-revive.shake { animation: revshake .4s; }
@keyframes revshake {
  20% { transform: translate(calc(-50% - 9px), -50%); }
  50% { transform: translate(calc(-50% + 8px), -50%); }
  80% { transform: translate(calc(-50% - 5px), -50%); }
}

/* Paper falling past the card. */
.confetti { inset: 0; overflow: hidden; pointer-events: none; }
/* ...and before it. Between the last passenger sitting down and the card there
   is a beat with the paper already falling over the board, so the celebration
   starts on the level the player just solved rather than on top of a panel that
   has covered it. Everything else on the layer waits. The layer itself does not
   get `pointer-events: none`: it is what stops a tap landing on the HUD
   underneath during that beat, on a level that is already over. */
#card.cheer { display: block; }
#card.cheer .dim, #card.cheer .rays, #card.cheer .design > *:not(.confetti) { display: none; }
.confetti i { position: absolute; width: 14px; height: 20px; border-radius: 3px; top: -30px;
  animation: fall linear infinite; }
@keyframes fall { to { transform: translateY(1240px) rotate(720deg); } }

@media (prefers-reduced-motion: reduce) {
  .rays, .confetti i, .cover { animation: none; }
  .star.pop { animation: none; transform: translate(-50%, -50%) scale(1); }
  .feat .fill { transition: none; }
}

/* A 390px phone could not hold what this bar used to carry at full size, and
   the answer was to step everything down a size rather than drop anything. The
   restart button that forced it has since gone from the bar - it lives in
   Settings, where the rest of the level's controls are - but the step-down
   stays: the gear, three pills and the difficulty chip are still more than a
   small phone holds comfortably at 44px. */
@media (max-width: 26rem) {
  .topbar { gap: .35rem;
    padding-left: calc(.45rem + var(--safe-l)); padding-right: calc(.45rem + var(--safe-r)); }
  .icon-btn { width: 38px; height: 38px; border-radius: 11px; font-size: 1rem; }
  .pill { padding: .26rem .6rem; gap: .3rem; }
  .pill-lab { font-size: .66rem; letter-spacing: .06em; }
  .pill-val { font-size: .95rem; }
  .pill-time { padding: .16rem .72rem .22rem; }
  .pill-time .pill-val { font-size: 1.3rem; }
  .pill-gold .disc { width: 17px; height: 17px; }
}

/* 320px, the smallest phone still in use, needs one more notch off everything. */
@media (max-width: 21rem) {
  .topbar { gap: .25rem; padding-left: calc(.3rem + var(--safe-l)); padding-right: calc(.3rem + var(--safe-r)); }
  .icon-btn { width: 34px; height: 34px; }
  .pill { padding: .24rem .5rem; }
  .pill-lab { font-size: .6rem; }
  .pill-time .pill-val { font-size: 1.2rem; }
}

/* ---------- the pause card ----------
   Marble Sort's `openSettings`, ported: the gear stops the clock and puts up a
   plain plate with everything there is to do on it, one full-width row per line,
   90 apart, starting 140 down. The results card's three plates and its coloured
   header are deliberately NOT reused - that panel announces that the level has
   ended, and dressing a pause in it says the same thing when it is not true.

   ⚠ The panel used to be `<div class="panel set-panel">`, which inherits
   `height: calc(392px + var(--dy) + ...)` - and `--dy` is declared on
   `#card .design`, not here. The calc was invalid, the face collapsed to nothing
   and the card was a set of buttons floating over the board with no plate under
   them at all.

   The same 540 x 1160 design box as everything else; `--k` is set on #app by
   fitDesign, so this inherits it and needs no fitting of its own. */
#settings { position: absolute; inset: 0; display: none; z-index: 22; font-family: var(--ms); }
#settings.on { display: block; }
#settings .dim { background: rgba(16,26,51,.7); }
#settings .design {
  position: absolute; left: 50%; top: 50%; width: 540px; height: 1160px;
  transform: translate(-50%, -50%) scale(var(--k)); transform-origin: 50% 50%;
}
#settings .design > * { position: absolute; }
/* five rows: 140 + 5 x 90 tall, centred in the box. Nothing here is measured
   from the bottom - see the note on the home screen's furniture. */
.set-panel {
  left: 66px; top: 285px; width: 408px; height: 590px; border-radius: 30px;
  background: var(--ms-face); box-shadow: 0 14px 36px rgba(0,0,0,.45);
}
.set-head {
  left: 0; top: 335px; width: 540px; text-align: center; transform: translateY(-50%);
  font-size: 38px; color: #fff; -webkit-text-stroke: 8px var(--ms-ink); paint-order: stroke fill;
}

/* The close disc, hung on the panel's top right corner. Marble Sort has no such
   thing - RESUME is its only way back - but the two do the same job and the disc
   is where a thumb already goes to dismiss a card. */
.set-x {
  left: 474px; top: 285px; width: 60px; height: 60px; padding: 0; cursor: pointer;
  transform: translate(-50%, -50%); border: 4px solid #fff; border-radius: 50%;
  background: linear-gradient(180deg, #ff8a8a, #d8556a); box-shadow: 0 4px 0 #a63c4e;
  color: #fff; font-family: var(--ms); font-size: 26px; line-height: 1;
}
.set-x:active { transform: translate(-50%, calc(-50% + 3px)); box-shadow: 0 1px 0 #a63c4e; }

/* One row per switch: an icon, a name, and the switch itself hard right. Marble
   Sort says SOUND ON / SOUND OFF on a button, which states the action rather
   than the state; a switch states the state, which is what the row is for. */
.set-row {
  left: 90px; width: 360px; height: 74px; border-radius: 20px; transform: translateY(-50%);
  background: rgba(43,53,80,.09);
  display: flex; align-items: center; gap: 16px; padding: 0 18px;
}
#set-row-sound { top: 425px; }
#set-row-vibe  { top: 515px; }
.set-ico { width: 38px; height: 38px; flex: none; display: block; }
.set-ico path, .set-ico rect { fill: none; stroke: var(--ms-ink); stroke-width: 2.2;
  stroke-linecap: round; stroke-linejoin: round; }
.set-ico path.solid { fill: var(--ms-ink); stroke: none; }
.set-lab { flex: 1; font-size: 27px; color: var(--ms-ink); }

/* The switch. Off is grey and the knob is left; on is the same green as the
   winning header, so the two overlays agree on what "good" looks like. */
.tog {
  flex: none; width: 96px; height: 48px; padding: 0; border: 0; border-radius: 999px;
  cursor: pointer; background: #b3b0c9; box-shadow: inset 0 3px 0 rgba(0,0,0,.12);
  transition: background .16s;
}
.tog i {
  display: block; width: 38px; height: 38px; margin: 5px; border-radius: 50%;
  background: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.2);
  transition: transform .16s;
}
.tog[aria-checked="true"] { background: var(--ms-win); }
.tog[aria-checked="true"] i { transform: translateX(48px); }

.set-btn { left: 270px; transform: translate(-50%, -50%); }
.set-btn:active { transform: translate(-50%, calc(-50% + 3px)); }
#set-retry  { top: 605px; }
#set-home   { top: 695px; }
#set-resume { top: 785px; }


/* ---------- the feature walkthroughs ----------
   Not one card that says everything at once: a short run of steps, each one
   pointing at a single thing and stopping there.

   A seat step rings the seat on the board and washes the rest of the room out
   around it, so "this seat" is a seat the player is already looking at rather
   than a sentence to match up with something later. A booster step lifts the
   button through the wash, hands over a free go, and then waits - the run does
   not move on until the button has actually been pressed and its effect has
   landed. The clock is held for the whole thing, so none of it is paid for in
   seconds.

   The bubble docks wherever the thing being pointed at is not, so it never
   stands on top of what it is describing. */
#intro { position: absolute; inset: 0; display: none; z-index: 24; font-family: var(--ms); }
#intro.on { display: block; }
/* Dark enough that what is lifted through it is the only thing on the screen.
   A light wash reads as a tint rather than as a spotlight, and the button being
   pointed at goes unnoticed. */
#intro .dim { background: rgba(9,7,28,.86); }
/* Except on the steps that ring a seat: those do their darkening on the canvas,
   with a hole cut where the seat is, and a heavy wash here would fill that hole
   straight back in. */
#intro.on-board .dim { background: rgba(11,9,34,.26); }
/* On the step that asks for a drag the overlay stops taking taps altogether,
   and the bubble alone keeps them. */
#intro.thru { pointer-events: none; }
#intro.thru .tip-box { pointer-events: auto; }

.tip {
  position: absolute; left: 50%; width: 452px;
  transform: translate(-50%, -50%) scale(var(--k)); transform-origin: 50% 50%;
}
.tip.dock-high   { top: 16%; }
.tip.dock-top    { top: 26%; }
.tip.dock-mid    { top: 50%; }
.tip.dock-bottom { top: 72%; }
/* The step that asks for a drag has to leave the board draggable, so its bubble
   is trimmed down and pushed up out of the way. */
.tip.slim { width: 486px; }
.tip.slim .tip-box { padding: 18px 24px 20px; }
.tip.slim .tip-text { font-size: 22px; }
.tip-box {
  position: relative; padding: 26px 30px 30px; border-radius: 32px; text-align: center;
  background: var(--ms-face); border: 6px solid var(--ms-edge);
  box-shadow: 0 18px 44px rgba(0,0,0,.5);
}
.tip-title {
  display: block; font-size: 31px; color: #fff; letter-spacing: .02em;
  -webkit-text-stroke: 7px var(--ms-ink); paint-order: stroke fill;
}
.tip-text {
  margin: 14px 0 0; font-family: var(--body); font-weight: 700;
  font-size: 24px; line-height: 1.42; color: var(--ms-ink);
}
#intro-ok { position: relative; left: auto; top: auto; margin-top: 22px; transform: none; }
#intro-ok:active { transform: translateY(3px); box-shadow: 0 3px 0 #2c8330; }
/* A step that is waiting on the player says so and hides its button: there is
   nothing to press but the thing being pointed at. */
.tip-wait {
  display: none; margin-top: 20px; font-size: 22px; color: #7b83ad;
  animation: tip-wait 1.2s ease-in-out infinite;
}
@keyframes tip-wait { 50% { opacity: .3; } }
.tip.waiting #intro-ok { display: none; }
.tip.waiting .tip-wait { display: block; }
.tip-dots {
  display: block; margin-top: 12px; font-size: 20px; letter-spacing: .3em;
  color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.55);
}

/* Whatever is being pointed at is lifted through the wash, grown, and ringed in
   a gold that glows onto the dark around it. All three together: a ring alone on
   a button the same size as the one beside it is easy to miss on a phone. */
#boosters.spotlight, #play .topbar.spotlight { z-index: 25; }
/* Lifting the bar lifts both buttons with it, so the one that is not being
   talked about is pushed well back down again. */
#boosters.spotlight .boost:not(.hint) { opacity: .12; filter: saturate(.2); }
.boost.hint, .pill.hint { transform: scale(1.22); }
/* Two rings, because one is easy to read past on a phone in daylight: a fat
   gold band welded to the button with a glow that spills onto the dark, and a
   second one that keeps going outwards like a radar sweep. */
.boost.hint::before, .pill.hint::before {
  content: ""; position: absolute; inset: -10px; border-radius: 30px;
  border: 6px solid var(--gold);
  box-shadow: 0 0 0 10px rgba(255,215,94,.3), 0 0 64px 26px rgba(255,215,94,.75);
  animation: boost-hint 1.05s ease-in-out infinite;
}
.boost.hint::after, .pill.hint::after {
  content: ""; position: absolute; inset: -10px; border-radius: 30px;
  border: 5px solid rgba(255,215,94,.9); pointer-events: none;
  animation: hint-radar 1.4s ease-out infinite;
}
.pill.hint { position: relative; }
.pill.hint::before, .pill.hint::after { inset: -8px; border-radius: 999px; }
@keyframes boost-hint {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.12); opacity: .6; }
}
@keyframes hint-radar {
  0%   { transform: scale(1); opacity: .9; }
  100% { transform: scale(1.7); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .boost.hint::before, .pill.hint::before, .tip-wait { animation: none; }
  .boost.hint::after, .pill.hint::after { display: none; }
}
</style>

<div id="app">
  <section id="home" class="screen on">
    <div class="design">
      <div class="edge edge-l" id="h-edge-l"></div>
      <div class="edge edge-r" id="h-edge-r"></div>
      <img class="cover" id="h-cover" alt="Seat Match">
      <div class="scrim" id="h-scrim"></div>

      <!-- Top left, the lives that let you start a level at all; top right, the
           picker. Mirroring each other rather than sitting together: one is a
           resource and the other is navigation. -->
      <button class="round" id="h-hearts" aria-label="Lives"><i></i><span>&#10084;</span><b>5</b><em></em></button>
      <button class="round" id="h-levels" aria-label="Choose a level"><i></i><span>&#9638;</span></button>

      <button class="wide-btn" id="h-play">PLAY</button>
      <div class="wallet">
        <i class="starw" id="h-star-icon"></i><span id="h-stars">0</span>
        <span class="gap"></span>
        <i class="coin"></i><span id="h-coins">0</span>
      </div>
      <div class="ver" id="h-ver"></div>
    </div>
  </section>

  <section id="levels" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="l-back" aria-label="Back">&larr;</button>
      <div class="meter"><div class="meter-top"><span class="lvl">CHOOSE A LEVEL</span></div></div>
      <span></span>
    </div>
    <div class="grid" id="l-grid"></div>
  </section>

  <section id="play" class="screen">
    <div class="stage"><canvas id="board" width="1200" height="900" aria-label="The room"></canvas></div>

    <!-- level, clock and gold across the top; boosters along the bottom -->
    <div class="topbar">
      <div class="hud-side">
        <button class="icon-btn" id="g-menu" aria-label="Settings">
          <svg class="gear" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.1"></circle>
            <path d="M12 2.6l1.5 2.3 2.7-.5.5 2.7 2.3 1.5-1.4 2.4 1.4 2.4-2.3 1.5-.5 2.7-2.7-.5L12 21.4
                     l-1.5-2.3-2.7.5-.5-2.7-2.3-1.5L4.4 13 3 10.6l2.3-1.5.5-2.7 2.7.5z"></path>
          </svg>
        </button>
        <div class="pill"><span class="pill-lab">Level</span><span class="pill-val" id="g-level">1</span></div>
        <button class="grade" id="g-grade" hidden></button>
      </div>
      <div class="pill pill-time">
        <span class="pill-lab">Time</span>
        <span class="pill-val" id="g-clock">5:00</span>
      </div>
      <div class="hud-side end">
        <div class="pill pill-gold"><span class="pill-val" id="g-coins">0</span><i class="disc"></i></div>
      </div>
    </div>

    <!-- drawn, not typed: an entity glyph is whatever font the phone happens to
         have, and the two of them came out at different sizes on every device -->
    <div class="boosters" id="boosters">
      <button class="boost" id="b-time" aria-label="Add time">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="13" r="8"></circle>
          <path d="M12 9v4l2.6 2.1M9 2.6h6M18.6 6.4l1.7-1.7"></path>
        </svg>
        <span class="cost" id="b-time-cost">300</span>
      </button>
      <button class="boost" id="b-jump" aria-label="Jump a seat">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.4v11M12 3.4 7.6 8M12 3.4 16.4 8M4.6 18.6h14.8"></path>
        </svg>
        <span class="cost" id="b-jump-cost">600</span>
      </button>
      <!-- the board, and a new lane opening on its left -->
      <button class="boost" id="b-area" aria-label="Add a lane">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.5 4.5h8v15h-8zM16.5 4.5v15"></path>
          <path d="M6 9.5v8M2 13.5h8"></path>
        </svg>
        <span class="cost" id="b-area-cost">1000</span>
      </button>
    </div>
    <div class="coach" id="coach" hidden role="status">
      <b id="coach-title"></b><span id="coach-text"></span>
    </div>
  </section>

  <p class="toast" id="hint" role="status"></p>

  <!-- Settings, built on the card's own panel so the two read as one family.
       Only switches that do something are here: there is no music track in the
       build, so there is no music switch to go with it. -->
  <!-- The walkthrough bubble. One per step; what it points at is ringed either
       on the canvas or on the button itself. -->
  <div id="intro">
    <div class="dim"></div>
    <div class="tip dock-mid" id="intro-tip">
      <div class="tip-box">
        <b class="tip-title" id="intro-title"></b>
        <p class="tip-text" id="intro-text"></p>
        <button class="wide-btn" id="intro-ok">GOT IT</button>
        <span class="tip-wait" id="intro-wait">Your turn</span>
      </div>
      <span class="tip-dots" id="intro-dots"></span>
    </div>
  </div>

  <div id="warn"><b class="stamp" id="warn-text"></b></div>

  <div id="settings">
    <div class="dim" id="set-dim"></div>
    <div class="design">
      <div class="set-panel"></div>
      <div class="set-head">PAUSED</div>
      <button class="set-x" id="set-close" aria-label="Close">&#10005;</button>

      <div class="set-row" id="set-row-sound">
        <svg class="set-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path class="solid" d="M4 9.5h3.4L12 5.4v13.2L7.4 14.5H4z"></path>
          <path d="M16 9.2a4 4 0 0 1 0 5.6M18.8 6.6a7.6 7.6 0 0 1 0 10.8"></path>
        </svg>
        <span class="set-lab">Sound</span>
        <button class="tog" id="set-sound" role="switch" aria-checked="true" aria-label="Sound"><i></i></button>
      </div>

      <div class="set-row" id="set-row-vibe">
        <svg class="set-ico" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="8" y="3.4" width="8" height="17.2" rx="2"></rect>
          <path d="M4.6 9.4v5.2M2 10.6v2.8M19.4 9.4v5.2M22 10.6v2.8"></path>
        </svg>
        <span class="set-lab">Vibration</span>
        <button class="tog" id="set-vibe" role="switch" aria-checked="true" aria-label="Vibration"><i></i></button>
      </div>

      <button class="wide-btn set-btn" id="set-retry">RESTART LEVEL</button>
      <button class="wide-btn blue set-btn" id="set-home">HOME</button>
      <button class="wide-btn set-btn" id="set-resume">RESUME</button>
    </div>
  </div>

  <div id="card">
    <div class="dim"></div>
    <div class="rays" id="c-rays"></div>
    <div class="design" id="c-card">
      <div class="confetti" id="c-confetti"></div>
      <div class="panel"><i></i><u><b></b></u></div>
      <div class="head" id="c-title">LEVEL COMPLETE!</div>
      <div class="stars" id="c-stars"></div>
      <p class="sum" id="c-sum"></p>
      <div class="feat" id="c-feat" hidden>
        <div class="track"></div>
        <div class="fill" id="c-feat-fill"></div>
        <div class="badge" id="c-feat-badge"></div>
        <div class="lab" id="c-feat-lab"></div>
      </div>
      <div class="coins" id="c-coins"><i class="coin"></i><span>+0</span></div>
      <div class="streak" id="c-streak" hidden></div>
      <!-- the stopwatch is the boosters' own, drawn twice: the dark pass is the
           button label's 6px ink stroke, which SVG has no text-stroke for -->
      <button class="wide-btn gold" id="c-revive" hidden>REVIVE<svg class="clk" viewBox="0 0 24 24"
        aria-hidden="true"><g class="ink"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.6 2.1M9 2.6h6M18.6 6.4l1.7-1.7"></path></g><g class="lit"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.6 2.1M9 2.6h6M18.6 6.4l1.7-1.7"></path></g></svg><b>1:00</b><span class="cost">500</span></button>
      <button class="wide-btn" id="c-next">NEXT LEVEL</button>
      <button class="wide-btn blue" id="c-home">HOME</button>
    </div>
  </div>
</div>
